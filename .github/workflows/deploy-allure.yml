name: API Tests + Allure Report

on:
  push:
    branches: [main]
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab
    inputs:
      env:
        description: "Environment to test"
        type: choice
        options: [stg, preprod, production]
        default: stg

permissions:
  contents: write               # needed to publish the report to the gh-pages branch

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run API tests
        env:
          ENV: ${{ github.event.inputs.env || 'stg' }}
          API_LOGIN_ID: ${{ secrets.API_LOGIN_ID }}
          API_LOGIN_PASSWORD: ${{ secrets.API_LOGIN_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: ./gradlew clean fullTest

      - name: Load previous report history (for trend charts)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into results
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history build/allure-results/history; fi

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate build/allure-results --clean -o allure-report

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages