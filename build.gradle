plugins {
    id 'java-library'
    id 'maven-publish'
   // id: 'java'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
     mavenCentral()
}

dependencies {
    implementation 'io.rest-assured:rest-assured:5.3.1'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation 'io.qameta.allure:allure-java-commons:2.24.0'
    implementation 'io.qameta.allure:allure-testng:2.20.1'
    implementation 'io.qameta.allure:allure-rest-assured:2.24.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    implementation 'com.itextpdf:itext7-core:7.2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    
    testImplementation 'org.testng:testng:7.7.0'
    testImplementation 'io.qameta.allure:allure-testng:2.24.0'

    //testImplementation 'org.testng:testng:7.4.0'
}

group = 'com.api.automation'
version = '1.0-SNAPSHOT'
description = 'api-framework'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

// Correct test task configuration
def allureResultsDir = "$buildDir/allure-results"

// Settings passed with -D on the gradlew command line are forwarded to every test task, e.g.
//   gradlew fullTest -DENV=preprod
def forwardedProps = ['ENV', 'apiGroup', 'flow', 'flowTags', 'baseUrl', 'allowWrites', 'envFile',
                      'API_LOGIN_ID', 'API_LOGIN_PASSWORD',
                      'MAIL_USERNAME', 'MAIL_PASSWORD', 'MAIL_TO', 'MAIL_SEND_ON']
tasks.withType(Test).configureEach {
    forwardedProps.each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
}

tasks.register('mainTests', Test) {
    doFirst {
        println "Running mainTests suite..."
    }
    useTestNG {
        suites 'src/test/resources/testng.xml'
    }
    systemProperty 'allure.results.directory', allureResultsDir
    ignoreFailures = true
    outputs.upToDateWhen { false }
}

tasks.register('retryTests', Test) {
    doFirst {
        println "Running retryTests suite..."
    }
    useTestNG {
        suites 'src/test/resources/BackToNormalTry.xml'
    }
    systemProperty 'allure.results.directory', allureResultsDir
    ignoreFailures = true
    outputs.upToDateWhen { false }
    mustRunAfter 'mainTests'
}

tasks.register('flowTests', Test) {
    doFirst {
        println "Running API flow suite..."
    }
    useTestNG {
        suites 'src/test/resources/flows.xml'
    }
    systemProperty 'allure.results.directory', allureResultsDir
    // e.g. gradlew flowTests -DENV=preprod -Dflow=user_learning_journey -DflowTags=smoke
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
    ignoreFailures = true
    outputs.upToDateWhen { false }
    mustRunAfter 'mainTests'
}

tasks.register('fullTest') {
    dependsOn 'mainTests', 'flowTests', 'retryTests'
}